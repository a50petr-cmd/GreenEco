# Автодеплой статического сайта на хостинг Рег.ру по FTP.
# Секреты: Settings → Secrets and variables → Actions
# FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR

name: Deploy to Reg.ru (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: Полная перезаливка (сброс состояния FTP-Deploy)
        type: boolean
        default: false

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP server directory
        id: ftpdir
        env:
          SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="$SERVER_DIR"
          case "$dir" in */) ;; *) dir="${dir}/" ;; esac
          echo "path=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload site to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.ftpdir.outputs.path }}
          log-level: verbose
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          exclude: |
            **/.git*
            **/.git/**
            **/.github/**
            **/.cursor/**
            **/README.md
            **/build-pages.js
            **/build-pages.ps1

      - name: Verify live homepage
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL "https://www.grineko.ru/" | grep -q "mc.yandex.ru/metrika/tag.js?id=113572869"; then
              echo "OK: homepage on www.grineko.ru contains the current Metrika counter"
              exit 0
            fi
            echo "Attempt ${attempt}: counter not on the live homepage yet; retry in 15s"
            sleep 15
          done
          echo "::error::Сайт не обновился. https://grineko.ru сейчас перенаправляет на www. Проверьте FTP_SERVER_DIR (обычно www/grineko.ru/)."
          exit 1
